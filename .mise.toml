[settings]
experimental = true
all_compile = false

[plugins]
krew = "https://github.com/soupglasses/mise-krew"

[tools]
# Build tools
sops = "3.13.3"
helmfile = "1.8.3"
helm = "4.3.1"
kustomize = "5.8.3"
kubectl = "1.37.2"
"github:postfinance/topf" = "0.6.2"

# Test Tools
kubeconform = "0.8.0"
kind = "0.33.0"
talosctl = "latest"
tilt = "0.37.8"

# Helpful tools
"krew:ctx" = "latest"
"krew:ns" = "latest"
"krew:cert-manager" = "latest"
"krew:cnpg" = "latest"
"krew:rook-ceph" = "latest"
cilium-cli = "latest"

[tasks]
"lint:helmfile".run = "helmfile lint"
"lint:kubeconform".run = "helmfile template | kubeconform -skip CustomResourceDefinition,CephCluster -schema-location default  -schema-location {{ 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' }}"
"lint".depends = "lint:*"

[tasks.test]
run = [
  { task = "test:setup" },
  { task = "test:run" },
  { task = "test:teardown" },
]

[tasks.tilt]
run = [
  { task = "test:setup" },
  "tilt up",
]
