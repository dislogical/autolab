name: Publish Release
on:
  workflow_dispatch:
    inputs:
      increment:
        description: The type of version bump to perform
        required: false
        type: choice
        options:
          - ""
          - major
          - minor
          - patch
      prerelease:
        description: The type of version bump to perform
        required: false
        type: choice
        options:
          - ""
          - alpha
          - beta
          - rc

jobs:
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Bump Version
        id: cz
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          increment: ${{ inputs.increment }}
          prerelease: ${{ inputs.prerelease }}
          changelog_increment_filename: release.md
          git_redirect_stderr: true
          push: false

      - name: Push Commit & Tag
        run: git push && git push --tags

      - name: Publish Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          body_path: release.md
          tag_name: v${{ steps.cz.outputs.version }}
