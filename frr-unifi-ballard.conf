router bgp 421001000
  ! Router ID
  bgp router-id 10.0.1.1
  !
  ! Require explicit policy for eBGP neighbors
  bgp ebgp-requires-policy
  !
  ! Relax autonomous system path matching for multipath routing
  bgp bestpath as-path multipath-relax
  maximum-paths 3
  !
  ! Create peer-group BALLARD-PROD with remote ASN 421010001
  neighbor BALLARD-PROD peer-group
  neighbor BALLARD-PROD remote-as 421010001
  !
  ! Add controller node IPs as neighbors
  neighbor 10.0.1.20 peer-group BALLARD-PROD
  neighbor 10.0.1.21 peer-group BALLARD-PROD
  neighbor 10.0.1.243 peer-group BALLARD-PROD
  neighbor 10.0.1.244 peer-group BALLARD-PROD
  neighbor 10.0.1.245 peer-group BALLARD-PROD
  neighbor 10.0.1.246 peer-group BALLARD-PROD
  !
  ! Apply policies
  address-family ipv4 unicast
    redistribute connected
    neighbor BALLARD-PROD activate
    neighbor BALLARD-PROD next-hop-self
    neighbor BALLARD-PROD soft-reconfiguration inbound
    neighbor BALLARD-PROD route-map ALLOW-ALL in
    neighbor BALLARD-PROD route-map ALLOW-ALL out
  exit-address-family
  !
  ! Allow all IPs
  route-map ALLOW-ALL permit 10
exit
